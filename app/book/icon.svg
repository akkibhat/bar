<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 16 120 136" width="120" height="136">
  <!--
    The Barbook favicon, applying to /book and everything under it.
    Backbar has none of its own and inherits the glass from `app/icon.svg`,
    which is the right default for the front door and the reference pages
    too.

    This is the open state of the mark - the glass split down the middle
    and the halves swung apart into two pages - where the root icon is the
    same shape shut.

    Drawn at the `micro` tier from `lib/geometry.ts`, which exists for
    exactly this: the spine is dropped and the pages lean further apart,
    so the valley between them is 18 units of a 120-unit viewBox and lands
    at 2.4px in a 16px favicon rather than the sub-pixel sliver the full
    tier would give. The paths below are `openHalf('left' | 'right',
    TIERS.micro)` verbatim - if that geometry changes, these are stale.

    Colours are literal rather than theme tokens: a favicon is fetched
    outside the page and has no stylesheet to read them from. Unlike the
    red, Barbook's blue is dark enough to sink into a dark tab strip, so
    it answers prefers-color-scheme with the same two hexes the accent-book
    token resolves to in `app/globals.css`.
  -->
  <style>
    .mark { fill: #334e7d; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #9db4e0; }
    }
  </style>
  <g class="mark">
    <path d="M4,28 L51,46 L51,140 L4,122 Z"/>
    <path d="M116,28 L69,46 L69,140 L116,122 Z"/>
  </g>
</svg>
